name: Sync final simulated datasets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-final-datasets.yml'
      - 'ml/augment_dataset.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numpy
        run: python -m pip install numpy==2.3.5
      - name: Regenerate two CSV datasets
        run: python ml/augment_dataset.py
      - name: Commit populated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/01_RAW_0_to_100_5_repeats.csv data/raw/02_AUGMENTED_0_to_100_500_cycles.csv
          if ! git diff --cached --quiet; then
            git commit -m "Add final 220-row raw and 2000-row augmented demo datasets"
            git push origin HEAD:main
          fi
