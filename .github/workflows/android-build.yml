name: Android Debug APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit and Robolectric tests
        run: gradle :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Copy Debug APK to app/OptiMilk-AI-debug.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk app/OptiMilk-AI-debug.apk

      - name: Upload OptiMilk-AI Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OptiMilk-AI-debug-apk
          path: app/OptiMilk-AI-debug.apk
